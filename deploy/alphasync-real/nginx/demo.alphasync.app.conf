# ============================================================================
#  Host nginx site — AlphaSync Real
#  Domain : demo.alphasync.app
#  Serves ONLY this app. Do NOT edit any other site file.
#
#    443 (TLS) ─┬─ /            → 127.0.0.1:3001   (frontend container)
#               ├─ /api/ /ws/   → 127.0.0.1:8001   (backend container)
#               └─ /uploads/    → 127.0.0.1:8001
#
#  Install as: /etc/nginx/sites-enabled/demo.alphasync.app.conf
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream alphasync_real_frontend { server 127.0.0.1:3001; }
upstream alphasync_real_backend  { server 127.0.0.1:8001; }

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name demo.alphasync.app;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.alphasync.app;

    ssl_certificate     /etc/nginx/ssl-certificates/demo.alphasync.app.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/demo.alphasync.app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://alphasync_real_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://alphasync_real_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://alphasync_real_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://alphasync_real_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
