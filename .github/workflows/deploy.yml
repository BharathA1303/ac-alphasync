name: Deploy Academic AlphaSync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required to push images to GHCR

concurrency:
  group: deploy-acalphasync-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image env
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/acalphasync-backend" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=acalphasync-backend
          cache-to: type=gha,mode=max,scope=acalphasync-backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image env
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/acalphasync-frontend" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY || 'AIzaSyAGvDpkigm9SurwQNhuJ9SKsSdnROCXhpE' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN || 'ac-alphasync.firebaseapp.com' }}
          VITE_ENABLE_PROGRESSIVE_OPTIONS: ${{ secrets.VITE_ENABLE_PROGRESSIVE_OPTIONS || vars.VITE_ENABLE_PROGRESSIVE_OPTIONS || 'true' }}
          VITE_PROGRESSIVE_DEBUG: ${{ secrets.VITE_PROGRESSIVE_DEBUG || vars.VITE_PROGRESSIVE_DEBUG || 'false' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || 'ac-alphasync' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET || 'ac-alphasync.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '141171621576' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID || '1:141171621576:web:4dc943a36713dc24cbaffd' }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund --silent
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prebuilt
          push: true
          provenance: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=acalphasync-frontend
          cache-to: type=gha,mode=max,scope=acalphasync-frontend

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GROK_API: ${{ secrets.GROK_API }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZEBU_API_SECRET: ${{ secrets.ZEBU_API_SECRET }}
      ZEBU_VENDOR_CODE: ${{ secrets.ZEBU_VENDOR_CODE }}
      ZEBU_MASTER_USER_ID: ${{ secrets.ZEBU_MASTER_USER_ID }}
      ZEBU_MASTER_PASSWORD: ${{ secrets.ZEBU_MASTER_PASSWORD }}
      ZEBU_MASTER_API_KEY: ${{ secrets.ZEBU_MASTER_API_KEY }}
      ZEBU_MASTER_VENDOR_CODE: ${{ secrets.ZEBU_MASTER_VENDOR_CODE }}
      ZEBU_MASTER_TOTP_SECRET: ${{ secrets.ZEBU_MASTER_TOTP_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercased image env
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/acalphasync-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/acalphasync-frontend" >> $GITHUB_ENV
          echo "GH_ACTOR=${OWNER_LOWER}" >> $GITHUB_ENV

      - name: Write Firebase credentials file
        run: |
          if [ -n "$FIREBASE_CREDS" ]; then
            printf '%s' "$FIREBASE_CREDS" > firebase-credentials.json
          else
            printf '{}' > firebase-credentials.json
            echo "WARNING: FIREBASE_CREDENTIALS_JSON secret not set — using empty credentials"
          fi
        env:
          FIREBASE_CREDS: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Fast upload deploy assets (Compressed Stream)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: "22"
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=6
            -o ConnectTimeout=15
            -o Compression=yes
            -p "$SERVER_PORT"
          )

          ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p /opt/acalphasync/deploy/nginx"
          tar -czf - docker-compose.yml deploy/nginx/ac.alphasync.app.conf firebase-credentials.json | \
            ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "tar -xzf - -C /opt/acalphasync"

      - name: Deploy & Restart Containers on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 12m
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GH_TOKEN,GH_ACTOR,GROK_API_KEY,GROK_API,GROQ_API_KEY,XAI_API_KEY,ZEBU_API_SECRET,ZEBU_VENDOR_CODE,ZEBU_MASTER_USER_ID,ZEBU_MASTER_PASSWORD,ZEBU_MASTER_API_KEY,ZEBU_MASTER_VENDOR_CODE,ZEBU_MASTER_TOTP_SECRET,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM_EMAIL,SMTP_FROM_NAME
          script: |
            set -eo pipefail
            DEPLOY_DIR="/opt/acalphasync"
            DOMAIN="ac.alphasync.app"

            echo "=== Preparing deploy directory ==="
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            echo "=== Logging in to GHCR ==="
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "=== Parallel Pulling latest images ==="
            docker pull "${BACKEND_IMAGE}:latest" &
            P1=$!
            docker pull "${FRONTEND_IMAGE}:latest" &
            P2=$!
            wait $P1 $P2

            docker tag "${BACKEND_IMAGE}:latest" acalphasync-backend:latest
            docker tag "${FRONTEND_IMAGE}:latest" acalphasync-frontend:latest

            if [ -z "${GROK_API_KEY}" ] && [ -n "${GROK_API}" ]; then
              export GROK_API_KEY="${GROK_API}"
            fi
            if [ -z "${GROK_API_KEY}" ] && [ -n "${GROQ_API_KEY}" ]; then
              export GROK_API_KEY="${GROQ_API_KEY}"
            fi
            if [ -z "${GROK_API_KEY}" ] && [ -n "${XAI_API_KEY}" ]; then
              export GROK_API_KEY="${XAI_API_KEY}"
            fi
            if [ -z "${XAI_API_KEY}" ] && [ -n "${GROK_API_KEY}" ]; then
              export XAI_API_KEY="${GROK_API_KEY}"
            fi

            echo "=== Updating acalphasync stack ==="
            GROK_API_KEY="${GROK_API_KEY}" XAI_API_KEY="${XAI_API_KEY}" \
            SMTP_HOST="${SMTP_HOST}" SMTP_PORT="${SMTP_PORT}" SMTP_USER="${SMTP_USER}" \
            SMTP_PASSWORD="${SMTP_PASSWORD}" SMTP_FROM_EMAIL="${SMTP_FROM_EMAIL}" SMTP_FROM_NAME="${SMTP_FROM_NAME}" \
              docker compose -p acalphasync -f docker-compose.yml up -d --no-build

            echo "=== Fast health check polling ==="
            HEALTHY=0
            for i in $(seq 1 90); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' acalphasync-backend 2>/dev/null || echo "unknown")
              if [ "${STATUS}" = "healthy" ]; then
                echo "Backend healthy after $((i * 2))s!"
                HEALTHY=1
                break
              fi
              STATE=$(docker inspect --format='{{.State.Status}}' acalphasync-backend 2>/dev/null || echo "unknown")
              if [ "${STATE}" = "exited" ] || [ "${STATE}" = "dead" ]; then
                echo "ERROR: Backend container crashed. Last 100 log lines:"
                docker logs acalphasync-backend --tail 100 2>&1
                exit 1
              fi
              if [ "${STATUS}" = "unhealthy" ]; then
                echo "ERROR: Backend marked unhealthy. Last 100 log lines:"
                docker logs acalphasync-backend --tail 100 2>&1
                exit 1
              fi
              sleep 2
            done

            if [ "${HEALTHY}" -eq 0 ]; then
              echo "ERROR: Backend did not become healthy within timeout. Last 100 log lines:"
              docker logs acalphasync-backend --tail 100 2>&1
              exit 1
            fi

            echo "=== Installing Nginx config ==="
            NGINX_CONF="/etc/nginx/sites-enabled/${DOMAIN}.conf"
            cp deploy/nginx/ac.alphasync.app.conf "${NGINX_CONF}"

            mkdir -p /etc/nginx/ssl-certificates /var/www/letsencrypt
            if [ ! -f "/etc/nginx/ssl-certificates/${DOMAIN}.crt" ]; then
              echo "Creating initial self-signed SSL cert..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout "/etc/nginx/ssl-certificates/${DOMAIN}.key" \
                -out "/etc/nginx/ssl-certificates/${DOMAIN}.crt" \
                -subj "/CN=${DOMAIN}" 2>/dev/null
            fi

            if nginx -t 2>&1; then
              systemctl reload nginx
              echo "Nginx reloaded successfully!"
            else
              echo "WARNING: Nginx config test failed — skipping reload"
            fi

            # Request real Let's Encrypt SSL certificate via Certbot
            if command -v certbot &>/dev/null; then
              echo "Requesting trusted Let's Encrypt SSL certificate via Certbot..."
              certbot certonly --webroot -w /var/www/letsencrypt -d "${DOMAIN}" --non-interactive --agree-tos -m ashok.j2346@gmail.com 2>/dev/null || true
              if [ -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
                cp "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" "/etc/nginx/ssl-certificates/${DOMAIN}.crt"
                cp "/etc/letsencrypt/live/${DOMAIN}/privkey.pem" "/etc/nginx/ssl-certificates/${DOMAIN}.key"
                systemctl reload nginx
                echo "Trusted Let's Encrypt SSL Certificate installed!"
              fi
            fi

            echo "=== Deployment finished successfully ==="
            docker compose -p acalphasync -f docker-compose.yml ps
            docker image prune -f &>/dev/null &
