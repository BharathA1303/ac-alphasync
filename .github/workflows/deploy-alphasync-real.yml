name: Deploy AlphaSync Real

# Server-side build model: the runner SSHes in; the server does
# git pull → docker compose pull → up -d --build → docker image prune -f.
on:
  workflow_dispatch:

concurrency:
  group: deploy-alphasync-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to /opt/apps/alphasync-real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 18m
          script: |
            set -eo pipefail
            APP="alphasync-real"
            APP_DIR="/opt/apps/${APP}"
            COMPOSE="docker compose -p ${APP} -f ${APP_DIR}/docker-compose.yml"

            # Server standard: this app lives ONLY at /opt/apps/alphasync-real.
            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "ERROR: ${APP_DIR} is not a git checkout. Provision it once (see README)."
              exit 1
            fi
            cd "${APP_DIR}"

            echo "=== git pull ==="
            git fetch --all --prune
            git reset --hard origin/main

            echo "=== docker compose pull (base images) ==="
            ${COMPOSE} pull --ignore-buildable || true

            echo "=== up -d --build (scoped to project ${APP} only) ==="
            ${COMPOSE} up -d --build

            echo "=== wait for backend health ==="
            for i in $(seq 1 40); do
              s="$(docker inspect --format='{{.State.Health.Status}}' ${APP}-backend 2>/dev/null || echo unknown)"
              [ "$s" = "healthy" ] && { echo "healthy"; break; }
              st="$(docker inspect --format='{{.State.Status}}' ${APP}-backend 2>/dev/null || echo unknown)"
              if [ "$st" = "exited" ] || [ "$st" = "dead" ]; then
                docker logs ${APP}-backend --tail 100; exit 1
              fi
              echo "  waiting... ($((i*5))s, status=$s)"; sleep 5
            done
            [ "$s" = "healthy" ] || { docker logs ${APP}-backend --tail 100; exit 1; }

            # Seed the root admin (idempotent; no-op until the account exists).
            if [ -f "${APP_DIR}/scripts/seed_root_admin.sh" ]; then
              echo "=== seed root admin ==="
              bash "${APP_DIR}/scripts/seed_root_admin.sh" || echo "root admin seed non-fatal"
            fi

            # Scoped cleanup ONLY. Never system/volume/network prune.
            echo "=== docker image prune -f ==="
            docker image prune -f

            echo "=== status ==="
            ${COMPOSE} ps
            echo "Deploy complete -> https://demo.alphasync.app"
