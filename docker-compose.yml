# ============================================================
#  Academic AlphaSync — Docker Compose (Contabo VPS)
#  Domain: ac.alphasync.app
#  Ports: frontend=3003, backend=8003, pg=5436 (bound to 127.0.0.1, nginx-only)
#  Container prefix: acalphasync-* (fully isolated from brokerdemo-* and RealAlphasync stacks)
# ============================================================

name: acalphasync

services:
  # ── Backend API (FastAPI + PostgreSQL) ───────────────────────
  acalphasync-backend:
    image: acalphasync-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acalphasync-backend
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - acalphasync-uploads:/app/uploads
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - APP_NAME=AlphaSync-Academic
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${AC_POSTGRES_USER:-acalphasync}:${AC_POSTGRES_PASSWORD:-acalphasync}@acalphasync-pg:5432/${AC_POSTGRES_DB:-acalphasync}
      - REDIS_URL=redis://acalphasync-redis:6379/0
      - CORS_ORIGINS=["https://ac.alphasync.app","http://localhost:3003"]
      - CORS_ORIGIN_REGEX=https?://(localhost|127\.0\.0\.1):\d+
      - SIMULATION_MODE=true
      - STRICT_ZEBU_MARKET_DATA=${STRICT_ZEBU_MARKET_DATA:-false}
      - ZEBU_WS_URL=${ZEBU_WS_URL:-wss://go.mynt.in/NorenWSTP/}
      - ZEBU_API_URL=${ZEBU_API_URL:-https://go.mynt.in/NorenWClientTP}
      - ZEBU_API_SECRET=${ZEBU_API_SECRET:-}
      - ZEBU_VENDOR_CODE=${ZEBU_VENDOR_CODE:-}
      - ZEBU_MASTER_USER_ID=${ZEBU_MASTER_USER_ID:-}
      - ZEBU_MASTER_PASSWORD=${ZEBU_MASTER_PASSWORD:-}
      - ZEBU_MASTER_API_KEY=${ZEBU_MASTER_API_KEY:-}
      - ZEBU_MASTER_VENDOR_CODE=${ZEBU_MASTER_VENDOR_CODE:-}
      - ZEBU_MASTER_TOTP_SECRET=${ZEBU_MASTER_TOTP_SECRET:-}
      - ZEBU_REDIRECT_URI=${ZEBU_REDIRECT_URI:-https://ac.alphasync.app/broker/callback}
      - ZEBU_OAUTH_CLIENT_ID=${ZEBU_OAUTH_CLIENT_ID:-}
      - ALICE_BLUE_REDIRECT_URI=${ALICE_BLUE_REDIRECT_URI:-https://ac.alphasync.app/broker/callback}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - ADMIN_EMAIL_ALLOWLIST=${ADMIN_EMAIL_ALLOWLIST:-["ashok.j2346@gmail.com"]}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - GROK_API=${GROK_API:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "-s", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 120s
    depends_on:
      acalphasync-pg:
        condition: service_healthy
      acalphasync-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - acalphasync-net

  # ── PostgreSQL (acalphasync-only, isolated) ───────────────────────
  acalphasync-pg:
    image: postgres:16-alpine
    container_name: acalphasync-pg
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: ${AC_POSTGRES_DB:-acalphasync}
      POSTGRES_USER: ${AC_POSTGRES_USER:-acalphasync}
      POSTGRES_PASSWORD: ${AC_POSTGRES_PASSWORD:-acalphasync}
    volumes:
      - acalphasync-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AC_POSTGRES_USER:-acalphasync} -d ${AC_POSTGRES_DB:-acalphasync}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - acalphasync-net

  # ── Redis ───────────────────────────────────────────────────
  acalphasync-redis:
    image: redis:7-alpine
    container_name: acalphasync-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - acalphasync-redis-data:/data
    restart: unless-stopped
    networks:
      - acalphasync-net

  # ── Frontend (React → Nginx → proxies /api to backend) ─────
  acalphasync-frontend:
    image: acalphasync-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    container_name: acalphasync-frontend
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      acalphasync-backend:
        condition: service_started
      acalphasync-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - acalphasync-net

volumes:
  acalphasync-uploads:
  acalphasync-pgdata:
  acalphasync-redis-data:

networks:
  acalphasync-net:
    driver: bridge
